<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>katacan — カタカン</title>
    <script type="text/javascript">
      // Truco estándar para SPAs en GitHub Pages: no hay servidor que
      // reescriba /katacan/collection a index.html, así que GitHub sirve
      // este 404.html, que redirige a index.html codificando la ruta
      // real en la query string. index.html la restaura antes de montar
      // React. https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // conserva el segmento "/katacan"
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
